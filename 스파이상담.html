<title>명식 · 사주팔자 정밀 분석</title>
<style>
:root{
  --bg:#f4efe4; --paper:#fbf8f0; --ink:#211f1a; --muted:#6d675b; --line:#d9d0bc; --accent:#8c2f2b; --accent-ink:#fff;
  --wood:#2f7a4b; --fire:#c23b2a; --earth:#a8792b; --metal:#6f7782; --water:#245a8f;
  --g2:#1f7a4d; --g1:#3b8f5f; --g0:#7a7466; --b1:#b8692b; --b2:#a3231f;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(60,40,10,.07);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#161512; --paper:#1f1d19; --ink:#ece6d8; --muted:#a59d8b; --line:#38342b; --accent:#d9695f; --accent-ink:#1a0a08;
    --wood:#5cc083; --fire:#f0705e; --earth:#d7a652; --metal:#a9b1bb; --water:#6fa8e0; --g2:#5cc083;--g1:#7fcf9c;--g0:#a59d8b;--b1:#e39a5b;--b2:#f0705e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:"Noto Serif KR","Nanum Myeongjo",serif;margin:0;line-height:1.35}
button,input,select{font:inherit;color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;max-width:960px;margin:0 auto}
.brand{display:flex;gap:12px;align-items:center}
.brand h1{font-size:20px}.brand p{margin:0;font-size:12px;color:var(--muted)}
.seal{display:grid;place-items:center;width:42px;height:42px;background:var(--accent);color:var(--accent-ink);font:700 22px "Noto Serif KR",serif;border-radius:6px;transform:rotate(-3deg)}
main{max-width:960px;margin:0 auto;padding:0 16px 32px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.form-card h2{font-size:20px;margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:13px;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=number],select{width:100%;min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{position:relative;display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:46px}
.seg input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.seg label{flex:1;display:grid;place-items:center;cursor:pointer;background:var(--bg)}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-2px}
.check{display:flex;gap:8px;align-items:center;margin:6px 0 12px;font-size:14px;color:var(--muted)}
.check input{width:20px;height:20px}
.primary{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;cursor:pointer;margin-top:6px}
.primary:active{transform:translateY(1px)}
.ghost{min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--paper);cursor:pointer;font-size:14px}
.err{color:var(--b2);font-size:14px;margin:4px 0}
.fine{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0}
.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.bar-r{display:flex;gap:6px;flex-wrap:wrap}
.warn{border-left:4px solid var(--b1);background:var(--paper);border-radius:8px;padding:10px 14px;margin:0 0 8px;font-size:14px}
.title-line{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.title-line h2{font-size:22px}.meta{font-size:13px;color:var(--muted)}
.pillars{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;text-align:center}
.pillars th,.pillars td{padding:6px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.pillars th{color:var(--muted);font-weight:500;width:64px;text-align:left;font-size:12px}
.pillars thead th,.pillars thead td{font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.pillars .big{font:700 38px/1.15 "Noto Serif KR",serif;padding:8px 0}
.pillars .ko{display:block;font:400 12px/1 system-ui;color:var(--muted);margin-top:2px}
.pillars td.day-col{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.el-w{color:var(--wood)}.el-f{color:var(--fire)}.el-e{color:var(--earth)}.el-m{color:var(--metal)}.el-s{color:var(--water)}
.chip{display:inline-block;padding:1px 8px;margin:1px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.hid{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;font-size:13px}.hid small{color:var(--muted)}
.chart-card{margin-bottom:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.tabs button{flex:0 0 auto;min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--paper);cursor:pointer;font-size:14px;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.sec h3{font-size:19px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec p{margin:0 0 10px;word-break:keep-all}
.sec ul{margin:6px 0 10px;padding-left:20px}.sec li{margin:4px 0;word-break:keep-all}
.sec .extra{font-size:13px;color:var(--muted)}
.bars{display:grid;gap:8px;margin:8px 0 12px}
.bar-row{display:grid;grid-template-columns:56px 1fr 44px;gap:8px;align-items:center;font-size:13px}
.bar-track{height:14px;background:var(--bg);border:1px solid var(--line);border-radius:999px;overflow:hidden}.bar-fill{height:100%}
.gauge{position:relative;height:16px;background:linear-gradient(90deg,var(--water),var(--g0),var(--fire));border-radius:999px;margin:10px 0 18px}
.gauge i{position:absolute;top:-4px;width:6px;height:24px;background:var(--ink);border-radius:3px;transform:translateX(-50%)}
.gauge-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-10px;margin-bottom:12px}
.yong{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.yong .y{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.y.k2{border-color:var(--g2);font-weight:700}.y.k1{border-color:var(--g1)}.y.m1{border-color:var(--b1)}.y.m2{border-color:var(--b2)}
.timeline{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px}
.tl{flex:0 0 92px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 6px;text-align:center;cursor:pointer}
.tl .g{font:700 24px "Noto Serif KR",serif}.tl .a{font-size:12px;color:var(--muted)}.tl .lv{font-size:12px;margin-top:2px;font-weight:700}
.tl[aria-pressed=true]{outline:2px solid var(--accent)}.tl.cur{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.g2{color:var(--g2)}.g1{color:var(--g1)}.g0{color:var(--g0)}.b1{color:var(--b1)}.b2{color:var(--b2)}
.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font-size:14px;margin:8px 0}.kv dt{color:var(--muted)}.kv dd{margin:0}
.yeargrid{display:grid;gap:8px}
details.year{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 12px}
details.year summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
table.terms{width:100%;border-collapse:collapse;font-size:14px}.terms th,.terms td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.terms tr.jie td{font-weight:700}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);max-width:min(560px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.saved-item{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.saved-item button{min-height:36px}
.foot{max-width:960px;margin:0 auto;padding:0 16px 28px;font-size:12px;color:var(--muted)}
@media print{
  body{background:#fff;color:#000}.top,.bar,.tabs,.foot .x,#btnInfo,dialog{display:none!important}
  .sec,.card{box-shadow:none;break-inside:avoid;border-color:#bbb}
  #tabBody .tabpane{display:block!important}
}
@media (prefers-reduced-motion:no-preference){.sec{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}


/* ===== 질문 분석 (qa) ===== */
.qa-wrap{margin-top:18px}
.qa-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
.qa-card h3{font-size:19px;margin-bottom:6px}
.qa-card .hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.qa-card textarea{width:100%;min-height:92px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);resize:vertical;line-height:1.6}
.qa-card textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.qa-chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.qa-chips button{min-height:36px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;font-size:13px}
.qa-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.qa-actions .primary{flex:1 1 180px;margin-top:0}
.qa-meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.qa-grid{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;text-align:center;font-size:13px}
.qa-grid th,.qa-grid td{padding:6px 2px;border-bottom:1px dashed var(--line)}
.qa-grid thead td{color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
.qa-grid th{width:58px;text-align:left;color:var(--muted);font-weight:500;font-size:12px}
.qa-grid .big{font:700 26px/1.2 "Noto Serif KR",serif}
.qa-grid td.pal{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.qa-sec{border:1px solid var(--line);border-radius:12px;background:var(--bg);margin:8px 0;padding:6px 12px}
.qa-sec summary{cursor:pointer;font-weight:700;min-height:38px;display:flex;align-items:center}
.qa-sec ul{margin:4px 0 8px;padding-left:18px}.qa-sec li{margin:5px 0;font-size:14px;word-break:keep-all}
.qa-sec li.g{color:var(--g2)}.qa-sec li.b{color:var(--b2)}
.qa-sec li::marker{color:var(--muted)}
.trend{display:grid;gap:6px;margin:8px 0}
.trend .tr{display:grid;grid-template-columns:70px 1fr 78px;gap:8px;align-items:center;font-size:13px}
.trend .tr .t{height:12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);position:relative;overflow:hidden}
.trend .tr .t i{position:absolute;top:0;bottom:0}
.trend .tr .t i.p{left:50%;background:var(--g1)}.trend .tr .t i.n{right:50%;background:var(--b1)}
.trend .tr .t::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--muted)}
.trend .tr.me{font-weight:700}
.concl{border:2px solid var(--accent);border-radius:14px;padding:18px;background:var(--paper);margin-top:12px;box-shadow:var(--shadow)}
.concl h3{font-size:20px;margin-bottom:8px}
.concl .verdict{display:inline-block;padding:4px 14px;border-radius:999px;border:2px solid currentColor;font-weight:700;font-size:17px;margin:2px 0 10px}
.concl h4{margin:12px 0 4px;font-size:15px}
.concl p{margin:0 0 8px;word-break:keep-all}.concl ul{margin:4px 0 8px;padding-left:20px}.concl li{margin:4px 0;word-break:keep-all;font-size:14px}
.concl .good li{color:var(--g2)}.concl .bad li{color:var(--b2)}
@media print{#qaBox .qa-input{display:none}}


/* ===== 대운표 ===== */
.dp-wrap{overflow-x:auto;margin:8px 0}
table.dp{width:100%;min-width:640px;border-collapse:collapse;font-size:13px;text-align:center}
.dp th,.dp td{padding:7px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.dp thead th{color:var(--muted);font-weight:500;font-size:12px;background:var(--bg);position:sticky;top:0}
.dp tbody tr{cursor:pointer}
.dp tbody tr:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.dp tr.cur td{background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:700}
.dp tr.sel td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
.dp .gj{font:700 20px "Noto Serif KR",serif}
.dp .sub{display:block;font-size:11px;color:var(--muted);font-weight:400}
.dp-note{font-size:12px;color:var(--muted);margin:4px 0 0}

</style>

<body>
<header class="top">
  <div class="brand"><span class="seal">命</span><div><h1>명식 命式</h1><p>정밀 만세력 · 고전 명리 해설</p></div></div>
  <nav class="top-actions">
    <button id="btnSaved" class="ghost" type="button">저장 목록</button>
    <button id="btnInfo" class="ghost" type="button">안내</button>
  </nav>
</header>

<main>
  <section id="viewForm" class="card form-card">
    <h2>출생 정보 입력</h2>
    <form id="form" autocomplete="off" novalidate>
      <div class="row">
        <label class="field"><span>이름</span><input id="name" type="text" maxlength="20" placeholder="이름(선택)"></label>
        <div class="field"><span>성별</span>
          <div class="seg" role="radiogroup" aria-label="성별">
            <input type="radio" id="gM" name="gender" value="M" checked><label for="gM">남</label>
            <input type="radio" id="gF" name="gender" value="F"><label for="gF">여</label>
          </div>
        </div>
      </div>
      <div class="row">
        <label class="field"><span>양력 생년월일</span><input id="date" type="date" min="1900-01-01" max="2100-12-31" required></label>
        <label class="field"><span>태어난 시각</span><input id="time" type="time" value="12:00"></label>
      </div>
      <label class="check"><input id="hourUnknown" type="checkbox"> 태어난 시간을 모릅니다 (3주로 분석)</label>
      <div class="row">
        <label class="field"><span>출생 지역</span>
          <select id="place">
            <option value="126.98|Asia/Seoul">서울</option><option value="126.70|Asia/Seoul">인천</option><option value="127.03|Asia/Seoul">수원·경기</option>
            <option value="127.38|Asia/Seoul">대전</option><option value="127.29|Asia/Seoul">세종</option><option value="127.49|Asia/Seoul">청주</option>
            <option value="128.60|Asia/Seoul">대구</option><option value="129.08|Asia/Seoul">부산</option><option value="129.31|Asia/Seoul">울산</option>
            <option value="128.68|Asia/Seoul">창원</option><option value="129.37|Asia/Seoul">포항</option><option value="126.85|Asia/Seoul">광주</option>
            <option value="127.15|Asia/Seoul">전주</option><option value="128.90|Asia/Seoul">강릉</option><option value="126.53|Asia/Seoul">제주</option>
            <option value="139.69|Asia/Tokyo">도쿄</option><option value="121.47|Asia/Shanghai">상하이</option><option value="116.41|Asia/Shanghai">베이징</option>
            <option value="-118.24|America/Los_Angeles">로스앤젤레스</option><option value="-74.00|America/New_York">뉴욕</option><option value="-0.13|Europe/London">런던</option>
            <option value="custom">직접 입력…</option>
          </select>
        </label>
        <label class="field"><span>보정 방식</span>
          <select id="timeMode">
            <option value="lmt">경도 보정 (출생지 평균태양시)</option>
            <option value="true">진태양시 (경도 + 균시차)</option>
            <option value="standard">표준시 그대로</option>
          </select>
        </label>
      </div>
      <div class="row" id="customRow" hidden>
        <label class="field"><span>경도 (동경 +, 서경 −)</span><input id="lon" type="number" step="0.01" min="-180" max="180" value="126.98"></label>
        <label class="field"><span>시간대(IANA)</span><input id="tz" type="text" value="Asia/Seoul" placeholder="예: Asia/Seoul"></label>
      </div>
      <label class="check"><input id="yaja" type="checkbox"> 야자시 적용 (23:00~23:59는 당일 일주 유지) — 기본은 조자시</label>
      <p id="formErr" class="err" role="alert" hidden></p>
      <button class="primary" type="submit">사주 풀이하기</button>
      <p class="fine">입력한 정보는 이 기기 안에서만 계산되며 서버로 전송되지 않습니다.</p>
    </form>
  </section>

  <section id="viewResult" hidden>
    <div class="bar">
      <button id="btnBack" class="ghost" type="button">← 다시 입력</button>
      <div class="bar-r">
        <button id="btnSave" class="ghost" type="button">저장</button>
        <button id="btnCopy" class="ghost" type="button">텍스트 복사</button>
        <button id="btnPrint" class="ghost" type="button">PDF/인쇄</button>
      </div>
    </div>
    <div id="warnings"></div>
    <div id="chartBox"></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="tabBody"></div>
    <div id="qaBox" class="qa-wrap"></div>
  </section>
</main>

<dialog id="dlg"><form method="dialog"><div id="dlgBody"></div><button class="primary" value="close">닫기</button></form></dialog>

<footer class="foot">
  <p>본 앱의 해설은 전통 명리학을 규칙 기반으로 구현한 참고용 콘텐츠이며, 오락·자기성찰 목적입니다. 의학·법률·투자·진로의 전문적 판단을 대체하지 않습니다.</p>
</footer>

  // ---------- 관계 계산 ----------

<script>

(function () {

      h += '<tr class="dp-row' + cl + '" data-i="' + i + '"><td>' + p.order + '</td><td><span class="gj">' + stemSpan(p.stem) + brSpan(p.branch) + '</span><span class="sub">' + esc(p.ganjiKo) + (d.current ? ' · 현재' : '') + '</span></td><td>' + p.ageStart + '~' + p.ageEnd + '세</td><td>' + p.startYear + '~' + p.endYear + '</td><td>' + esc(p.startDate) + '</td><td>' + D.TENGOD[p.tenGodStem] + '</td><td>' + D.TENGOD[p.tenGodBranch] + '</td><td>' + D.UNSEONG[p.unseong] + '</td><td>' + D.sinsal12(P.year.branch, p.branch) + '</td><td>' + D.HIDDEN[p.branch].map(function (x) { return stemSpan(x[0]); }).join('') + '</td><td class="' + d.cls + '">' + esc(d.level.split(' ')[0]) + '</td></tr>';
    });
    h += '</tbody></table></div><p class="dp-note">나이는 만 나이 기준(한국식 세는나이는 +1). 연도는 출생연도 + 대운수로 시작하며, 정밀 시작일은 절기 환산 결과를 참고용으로 표시한 것입니다. 행을 누르면 아래에 해당 대운의 세운이 표시됩니다.</p></section>';
    h += '<section class="sec"><h3>' + esc(curPer.ganjiKo) + ' 대운 (' + curPer.ageStart + '~' + curPer.ageEnd + '세) 세운표</h3><div class="dp-wrap"><table class="dp"><thead><tr><th>연도</th><th>만 나이</th><th>한국 나이</th><th>세운</th><th>천간 십성</th><th>지지 십성</th><th>12운성</th><th>길흉</th></tr></thead><tbody>';
    cur.years.forEach(function (y, j) {
      var py = curPer.years[j], nowY = new Date().getFullYear();
      h += '<tr class="' + (y.year === nowY ? 'cur' : '') + '" style="cursor:default"><td>' + y.year + (y.year === nowY ? ' ★' : '') + '</td><td>' + py.manAge + '세</td><td>' + y.age + '세</td><td><span class="gj">' + stemSpan(py.stem) + brSpan(py.branch) + '</span><span class="sub">' + esc(y.ganjiKo) + '</span></td><td>' + D.TENGOD[y.tenGodStem] + '</td><td>' + D.TENGOD[y.tenGodBranch] + '</td><td>' + y.unseong + '</td><td class="' + y.cls + '">' + esc(y.level.split(' ')[0]) + '</td></tr>';
    });
    return h + '</tbody></table></div></section>';
  }
  function wireDaeun() {
    Array.prototype.forEach.call(document.querySelectorAll('.dp-row'), function (b) { b.onclick = function () { state.daeun = +b.dataset.i; render(); }; });
    Array.prototype.forEach.call(document.querySelectorAll('.tl'), function (b) { b.onclick = function () { state.daeun = +b.dataset.i; render(); }; });
  }


  // ---------- 질문 분석 (qa) ----------
  var QA_SAMPLES = ['올해 이직해도 될까요?', '내년 연애운과 결혼 시기는 언제인가요?', '2027년 투자·재물운은 어떤가요?', '올해 건강에서 조심할 점은?', '지금 시험 준비 중인데 합격할 수 있을까요?'];
  function qaTone(t) { return t === 'g' ? ' class="g"' : t === 'b' ? ' class="b"' : ''; }
  function renderQA() {
    var box = $('qaBox');
    box.innerHTML = '<section class="qa-card qa-input"><h3>궁금한 점을 물어보세요</h3>' +
      '<p class="hint">질문 내용을 이 명식의 원국·대운·세운에 대입해 육친·십성, 12운성, 신살, 합형충파해·원진, 천을귀인, 공망, 투출·입고, 삼형살을 분석하고 마지막에 길흉 결론을 드립니다. 시기(올해·내년·2027년·35세 등)를 넣으면 그 해로 분석합니다.</p>' +
      '<textarea id="qaText" maxlength="300" placeholder="예) 올해 이직해도 될까요? / 내년에 결혼운이 있나요?"></textarea>' +
      '<div class="qa-chips">' + QA_SAMPLES.map(function (s, i) { return '<button type="button" data-s="' + i + '">' + esc(s) + '</button>'; }).join('') + '</div>' +
      '<p id="qaErr" class="err" role="alert" hidden></p>' +
      '<div class="qa-actions"><button id="qaGo" class="primary" type="button">질문 분석하기</button></div></section><div id="qaResult" aria-live="polite"></div>';
    Array.prototype.forEach.call(box.querySelectorAll('[data-s]'), function (b) { b.onclick = function () { $('qaText').value = QA_SAMPLES[+b.dataset.s]; $('qaText').focus(); }; });
    $('qaGo').onclick = runQA;
  }
  function runQA() {
    var q = $('qaText').value.trim(), err = $('qaErr'); err.hidden = true;
    if (q.length < 2) { err.textContent = '질문을 입력해 주세요.'; err.hidden = false; return; }
    var res;
    try { res = SajuQA.answer(state.chart, state.ana, q); }
    catch (e) { console.error(e); err.textContent = '분석 중 오류가 발생했습니다: ' + e.message; err.hidden = false; return; }
    state.qa = res;
    $('qaResult').innerHTML = qaHtml(res);
    var cp = $('qaCopy'); if (cp) cp.onclick = function () { copyText(qaPlain(res)); };
    var pr = $('qaPrint'); if (pr) pr.onclick = function () { window.print(); };
    var dl = $('qaDown'); if (dl) dl.onclick = function () { downloadQA(res); };
    var top = $('qaResult'); if (top.scrollIntoView) top.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function copyText(t) {
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('복사했습니다.'); }, function () { dialog('<h3>텍스트</h3><textarea style="width:100%;height:50vh" readonly>' + esc(t) + '</textarea>'); });
  }
  function qaGridHtml(r) {
    var cols = r.grid, h = '<div style="overflow-x:auto"><table class="qa-grid"><thead><tr><td></td>' + cols.map(function (c) { return '<td>' + esc(c.label) + '</td>'; }).join('') + '</tr></thead><tbody>';
    function row(label, fn) { return '<tr><th>' + label + '</th>' + cols.map(function (c) { return '<td' + (c.palace ? ' class="pal"' : '') + '>' + (c.empty ? '—' : fn(c)) + '</td>'; }).join('') + '</tr>'; }
    h += row('십성(천간)', function (c) { return c.label.indexOf('일주') === 0 ? '일간' : D.TENGOD[c.tgS]; });
    h += row('천간', function (c) { return '<div class="big">' + stemSpan(c.stem) + '</div>'; });
    h += row('지지', function (c) { return '<div class="big">' + brSpan(c.branch) + '</div>'; });
    h += row('십성(지지)', function (c) { return D.TENGOD[c.tgB]; });
    h += row('12운성', function (c) { return D.UNSEONG[c.unseong]; });
    return h + '</tbody></table></div><p class="meta">음영: 질문 영역과 관련 깊은 궁위</p>';
  }
  function qaHtml(r) {
    var c = r.conclusion, h = '';
    h += '<section class="qa-card"><h3>질문 분석</h3><p><b>Q.</b> ' + esc(r.question) + '</p><div class="qa-meta"><span class="chip">주제: ' + esc(r.topic.label) + '</span><span class="chip">분석 시점: ' + r.years.join('·') + '년' + (r.implicit ? ' (시점 미지정 → 올해)' : '') + '</span><span class="chip">핵심 육친: ' + esc(r.summary.main) + '</span></div>';
    h += '<p class="extra" style="font-size:13px;color:var(--muted)">관련 궁위: ' + esc(r.summary.palaces.join(' · ')) + '</p>';
    h += '<h4 style="margin:10px 0 4px">원국 + 대운 + 세운 대입표</h4>' + qaGridHtml(r) + '</section>';
    h += '<section class="qa-card"><h3>명리학적 분석</h3>' + r.sections.map(function (s, i) {
      return '<details class="qa-sec"' + (i < 3 ? ' open' : '') + '><summary>' + esc(s.title) + '</summary><ul>' + s.lines.map(function (l) { return '<li' + qaTone(l.tone) + '>' + esc(l.t) + '</li>'; }).join('') + '</ul></details>';
    }).join('') + '</section>';
    h += '<section class="qa-card"><h3>향후 10년 흐름 (' + esc(r.topic.subj) + ')</h3><div class="trend">' + r.trend.map(function (t) {
      var w = Math.min(50, Math.abs(t.total) / 4 * 50);
      var me = r.years.indexOf(t.year) >= 0;
      return '<div class="tr' + (me ? ' me' : '') + '"><span>' + t.year + (me ? '★' : '') + '<br><small class="meta">' + t.seunGanji + '·' + t.age + '세</small></span><div><div class="t"><i class="' + (t.total >= 0 ? 'p' : 'n') + '" style="width:' + w + '%"></i></div><small class="meta">' + esc(t.why) + '</small></div><span class="' + t.cls + '">' + esc(t.level.split(' ')[0]) + '</span></div>';
    }).join('') + '</div></section>';
    h += '<section class="concl"><h3>결론 — 질문에 대한 답</h3><div class="verdict ' + c.cls + '">' + esc(c.level) + '</div>' + c.paras.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
    if (c.good.length) h += '<h4 class="g2">길(吉)한 요인</h4><ul class="good">' + c.good.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    if (c.bad.length) h += '<h4 class="b2">흉(凶)·주의 요인</h4><ul class="bad">' + c.bad.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    h += '<h4>시기 정리</h4><ul>' + c.timing.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    h += '<h4>조언</h4><ul>' + c.advice.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    h += '<p class="fine" style="text-align:left">' + esc(c.caution) + '</p>';
    h += '<div class="qa-actions"><button id="qaCopy" class="ghost" type="button">답변 복사</button><button id="qaDown" class="ghost" type="button">답변 저장(.txt)</button><button id="qaPrint" class="ghost" type="button">PDF/인쇄</button></div></section>';
    return h;
  }
  function qaPlain(r) {
    var c = r.conclusion, o = ['[질문] ' + r.question, '주제: ' + r.topic.label + ' / 분석 시점: ' + r.years.join('·') + '년', ''];
    r.sections.forEach(function (s) { o.push('■ ' + s.title); s.lines.forEach(function (l) { o.push('- ' + l.t); }); o.push(''); });
    o.push('■ 향후 10년 흐름'); r.trend.forEach(function (t) { o.push('- ' + t.year + '년(' + t.seunGanji + ', ' + t.age + '세): ' + t.level + ' · ' + t.why); }); o.push('');
    o.push('■ 결론: ' + c.level); c.paras.forEach(function (p) { o.push(p); });
    if (c.good.length) { o.push('[길한 요인]'); c.good.forEach(function (x) { o.push('- ' + x); }); }
    if (c.bad.length) { o.push('[흉·주의 요인]'); c.bad.forEach(function (x) { o.push('- ' + x); }); }
    o.push('[시기]'); c.timing.forEach(function (x) { o.push('- ' + x); });
    o.push('[조언]'); c.advice.forEach(function (x) { o.push('- ' + x); });
    o.push(''); o.push(c.caution);
    return o.join('\n');
  }
  function downloadQA(r) {
    try {
      var blob = new Blob([qaPlain(r)], { type: 'text/plain;charset=utf-8' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = '사주질문분석.txt'; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    } catch (e) { copyText(qaPlain(r)); }
  }

  // ---------- 저장/복사/인쇄 ----------
  function plainText() {
    var c = state.chart, a = state.ana, P = c.pillars;
    var out = ['[명식] ' + (c.input.name || '') + ' ' + (c.input.gender === 'M' ? '남' : '여') + ' ' + c.input.year + '.' + c.input.month + '.' + c.input.day + ' ' + (c.input.hourUnknown ? '시간미상' : c.input.hour + ':' + String(c.input.minute).padStart(2, '0')),
      '시주 ' + (P.hour ? P.hour.ganji : '--') + ' / 일주 ' + P.day.ganji + ' / 월주 ' + P.month.ganji + ' / 연주 ' + P.year.ganji, ''];
    a.sections.forEach(function (s) { out.push('■ ' + s.title); (s.paragraphs || []).forEach(function (p) { out.push(p); }); (s.bullets || []).forEach(function (b) { out.push('- ' + b); }); out.push(''); });
    out.push('■ 대운별 분석');
    a.daeun.forEach(function (d) { out.push(d.head + ' · ' + d.level); out.push(d.summary); d.risk.forEach(function (r) { out.push('  · ' + r); }); out.push(''); });
    return out.join('\n');
  }
  $('btnCopy').onclick = function () {
    var t = plainText();
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('복사했습니다.'); }, function () { dialog('<h3>텍스트</h3><textarea style="width:100%;height:50vh" readonly>' + esc(t) + '</textarea>'); });
  };
  $('btnPrint').onclick = function () { var prev = state.tab; document.querySelectorAll('.tabpane').forEach(function () { }); printAll(); };
  function printAll() {
    var html = ''; var save = state.tab;
    ['summary', 'personality', 'dist', 'strength', 'gyeok', 'yongshin', 'stem', 'branch', 'job', 'love', 'career', 'daeunpyo', 'daeun', 'seun', 'health', 'classic'].forEach(function (t) { html += tabHtml(t); });
    $('tabBody').innerHTML = '<div class="tabpane">' + html + '</div>';
    setTimeout(function () { window.print(); setTimeout(render, 300); }, 50);
  }
  function toast(m) { dialog('<p>' + esc(m) + '</p>'); }
  function dialog(h) { $('dlgBody').innerHTML = h; var d = $('dlg'); if (d.showModal) d.showModal(); else alert(d.textContent); }

  $('btnSave').onclick = function () {
    var list = store('get', 'saju.saved') || [];
    list.unshift(Object.assign({ id: Date.now() }, state.chart.input)); list = list.slice(0, 30);
    store('set', 'saju.saved', list); toast('저장했습니다.');
  };
  $('btnSaved').onclick = function () {
    var list = store('get', 'saju.saved') || [];
    if (!list.length) return dialog('<h3>저장 목록</h3><p>저장된 명식이 없습니다.</p>');
    dialog('<h3>저장 목록</h3>' + list.map(function (x) { return '<div class="saved-item"><span>' + esc(x.name || '이름 없음') + ' · ' + x.year + '.' + x.month + '.' + x.day + '</span><span><button class="ghost" data-open="' + x.id + '" type="button">열기</button> <button class="ghost" data-del="' + x.id + '" type="button">삭제</button></span></div>'; }).join(''));
    document.querySelectorAll('[data-open]').forEach(function (b) { b.onclick = function () { var it = list.filter(function (x) { return String(x.id) === b.dataset.open; })[0]; $('dlg').close(); if (it) run(it); }; });
    document.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function () { store('set', 'saju.saved', list.filter(function (x) { return String(x.id) !== b.dataset.del; })); $('dlg').close(); $('btnSaved').click(); }; });
  };
  $('btnInfo').onclick = function () {
    dialog('<h3>계산 방식 안내</h3><ul><li><b>절기</b>: VSOP87 태양 황경을 직접 계산해 입춘·절입 시각을 분 단위로 산출합니다.</li><li><b>시간 보정</b>: 한국의 표준시 변경(1908·1912·1954·1961)과 서머타임(1948~51, 1955~60, 1987~88)을 IANA 시간대 DB로 반영하고, 출생지 경도 보정/균시차를 선택할 수 있습니다.</li><li><b>자시</b>: 기본 조자시(23시부터 다음 날 일주). 야자시 옵션 제공.</li><li><b>대운</b>: 양남음녀 순행·음남양녀 역행, 3일=1년 환산, 절입 시각 기준.</li><li><b>해석</b>: 자평진전(격국), 적천수(일간론), 궁통보감(조후)을 규칙화한 것으로 학파별 차이가 있습니다.</li></ul><p class="fine">' + esc(T.DISCLAIMER) + '</p>');
  };

  // 서비스 워커 (웹/PWA)
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(function () { });
  // 최근 입력 복원
  var last = store('get', 'saju.last');
  if (last) { try { $('name').value = last.name || ''; } catch (e) { } }
  $('form').addEventListener('submit', function () { store('set', 'saju.last', { name: $('name').value }); });
})();

</script>
